name: Build Shopping APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        shell: python
        run: |
          import pathlib, json
          files = json.loads('{"settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\\nrootProject.name = \'ShoppingList\'\\ninclude \':app\'\\n", "build.gradle": "plugins { id \'com.android.application\' version \'8.7.3\' apply false }\\n", "app/build.gradle": "plugins { id \'com.android.application\' }\\nandroid {\\n namespace \'ru.gptmobile.shoppinglist\'\\n compileSdk 35\\n defaultConfig {\\n  applicationId \'ru.gptmobile.shoppinglist\'\\n  minSdk 23\\n  targetSdk 35\\n  versionCode 1\\n  versionName \'1.0\'\\n }\\n}\\n", "app/src/main/AndroidManifest.xml": "<manifest xmlns:android=\\"http://schemas.android.com/apk/res/android\\">\\n<application android:theme=\\"@android:style/Theme.Material.Light.NoActionBar\\" android:label=\\"Список покупок\\" android:allowBackup=\\"false\\" android:supportsRtl=\\"true\\">\\n<activity android:name=\\".MainActivity\\" android:exported=\\"true\\" android:windowSoftInputMode=\\"adjustResize\\"><intent-filter><action android:name=\\"android.intent.action.MAIN\\"/><category android:name=\\"android.intent.category.LAUNCHER\\"/></intent-filter></activity>\\n</application></manifest>\\n", "app/src/main/java/ru/gptmobile/shoppinglist/MainActivity.java": "package ru.gptmobile.shoppinglist;\\n\\nimport android.app.*;\\nimport android.os.Bundle;\\nimport android.graphics.Color;\\nimport android.view.*;\\nimport android.widget.*;\\nimport org.json.*;\\nimport java.util.*;\\n\\npublic class MainActivity extends Activity {\\n static class Item { String name, amount; boolean done; Item(String n,String a,boolean d){name=n;amount=a;done=d;} }\\n final ArrayList<Item> items=new ArrayList<>();\\n LinearLayout list; TextView summary; EditText name, amount;\\n int dp(int n){return (int)(getResources().getDisplayMetrics().density*n+.5f);}\\n TextView text(String value,int size){TextView t=new TextView(this);t.setText(value);t.setTextSize(size);t.setTextColor(Color.rgb(30,41,59));return t;}\\n @Override public void onCreate(Bundle b){super.onCreate(b);\\n  LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setPadding(dp(20),dp(20),dp(20),dp(12));root.setBackgroundColor(Color.rgb(248,250,252));setContentView(root);\\n  root.setOnApplyWindowInsetsListener((v,insets)->{v.setPadding(dp(20)+insets.getSystemWindowInsetLeft(),dp(20)+insets.getSystemWindowInsetTop(),dp(20)+insets.getSystemWindowInsetRight(),dp(12)+insets.getSystemWindowInsetBottom());return insets;});\\n  root.addView(text(\\"Список покупок\\",28));\\n  summary=text(\\"\\",15);root.addView(summary);\\n  name=new EditText(this);name.setHint(\\"Что купить?\\");name.setSingleLine(true);name.setInputType(android.text.InputType.TYPE_CLASS_TEXT|android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);root.addView(name);\\n  amount=new EditText(this);amount.setHint(\\"Количество: например, 2 кг\\");amount.setSingleLine(true);root.addView(amount);\\n  Button add=new Button(this);add.setText(\\"Добавить товар\\");root.addView(add);\\n  add.setOnClickListener(v->{String n=name.getText().toString().trim();if(n.isEmpty()){name.setError(\\"Введите название товара\\");return;}items.add(new Item(n,amount.getText().toString().trim(),false));save();name.setText(\\"\\");amount.setText(\\"\\");name.requestFocus();render();});\\n  ScrollView scroll=new ScrollView(this);list=new LinearLayout(this);list.setOrientation(1);scroll.addView(list);root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));\\n  Button clear=new Button(this);clear.setText(\\"Удалить купленное\\");root.addView(clear);clear.setOnClickListener(v->{boolean found=false;for(Item i:items)if(i.done)found=true;if(!found){Toast.makeText(this,\\"Нет купленных товаров\\",Toast.LENGTH_SHORT).show();return;}new AlertDialog.Builder(this).setTitle(\\"Удалить купленные товары?\\").setMessage(\\"Остальные товары останутся в списке.\\").setNegativeButton(\\"Отмена\\",null).setPositiveButton(\\"Удалить\\",(d,w)->{for(int k=items.size()-1;k>=0;k--)if(items.get(k).done)items.remove(k);save();render();}).show();});\\n  load();render();\\n }\\n void render(){list.removeAllViews();int done=0;for(Item i:items)if(i.done)done++;summary.setText(\\"Купить: \\"+(items.size()-done)+\\"   •   Куплено: \\"+done);\\n  if(items.isEmpty()){TextView empty=text(\\"Список пока пуст. Добавьте первый товар выше.\\",18);empty.setPadding(0,dp(32),0,0);list.addView(empty);}\\n  for(Item i:items){LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER_VERTICAL);row.setPadding(0,dp(6),0,dp(6));CheckBox check=new CheckBox(this);check.setText(i.name+(i.amount.isEmpty()?\\"\\":\\" — \\"+i.amount));check.setTextSize(18);check.setChecked(i.done);if(i.done){check.setPaintFlags(check.getPaintFlags()|android.graphics.Paint.STRIKE_THRU_TEXT_FLAG);check.setTextColor(Color.GRAY);}row.addView(check,new LinearLayout.LayoutParams(0,-2,1));check.setOnCheckedChangeListener((b,on)->{i.done=on;save();render();});Button del=new Button(this);del.setText(\\"×\\");del.setTextSize(24);del.setContentDescription(\\"Удалить: \\"+i.name);row.addView(del,new LinearLayout.LayoutParams(dp(56),dp(52)));del.setOnClickListener(v->new AlertDialog.Builder(this).setTitle(\\"Удалить товар?\\").setMessage(i.name).setNegativeButton(\\"Отмена\\",null).setPositiveButton(\\"Удалить\\",(d,w)->{items.remove(i);save();render();}).show());list.addView(row);}\\n }\\n void save(){try{JSONArray a=new JSONArray();for(Item i:items){JSONObject o=new JSONObject();o.put(\\"name\\",i.name);o.put(\\"amount\\",i.amount);o.put(\\"done\\",i.done);a.put(o);}getSharedPreferences(\\"shopping\\",MODE_PRIVATE).edit().putString(\\"items\\",a.toString()).apply();}catch(JSONException e){Toast.makeText(this,\\"Не удалось сохранить список\\",Toast.LENGTH_LONG).show();}}\\n void load(){try{JSONArray a=new JSONArray(getSharedPreferences(\\"shopping\\",MODE_PRIVATE).getString(\\"items\\",\\"[]\\"));for(int k=0;k<a.length();k++){JSONObject o=a.getJSONObject(k);items.add(new Item(o.getString(\\"name\\"),o.optString(\\"amount\\"),o.optBoolean(\\"done\\")));}}catch(JSONException e){Toast.makeText(this,\\"Не удалось прочитать сохранённый список\\",Toast.LENGTH_LONG).show();}}\\n}\\n"}')
          for name, content in files.items():
              p = pathlib.Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShoppingList-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
